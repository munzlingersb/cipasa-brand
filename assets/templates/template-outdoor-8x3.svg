<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="4800" height="1800" viewBox="0 0 4800 1800" role="img" aria-labelledby="t d">
  <title id="t">Template Outdoor 8:3 — Layout B expandido</title>
  <desc id="d">Grid de outdoor horizontal 8m×3m (proporção 8:3). Safe zones para legibilidade a 100m de distância. Texto crítico em zona central com hierarquia clara.</desc>

  <defs>
    <style>
      .canvas { fill: #F8FAF9; }
      .safe-zone { fill: none; stroke: #62BB46; stroke-width: 6; stroke-dasharray: 16 16; }
      .danger-zone { fill: #FF6B6B; opacity: 0.15; }
      .area-label { fill: #005A45; font-family: 'Work Sans', sans-serif; font-size: 48px; font-weight: 700; }
      .label-mini { fill: #555454; font-family: 'Work Sans', sans-serif; font-size: 36px; }
      .circle-pos { fill: none; stroke: #62BB46; stroke-width: 6; opacity: 0.55; }
    </style>
  </defs>

  <rect class="canvas" width="4800" height="1800"/>

  <!-- Margem perigosa (cobertura por estrutura/cabos) -->
  <rect class="danger-zone" x="0" y="0" width="4800" height="120"/>
  <rect class="danger-zone" x="0" y="1680" width="4800" height="120"/>
  <rect class="danger-zone" x="0" y="0" width="120" height="1800"/>
  <rect class="danger-zone" x="4680" y="0" width="120" height="1800"/>
  <text class="label-mini" x="140" y="80">DANGER ZONE · cobertura por estrutura · 120px</text>

  <!-- Safe zone (texto crítico aqui dentro) -->
  <rect class="safe-zone" x="180" y="180" width="4440" height="1440"/>
  <text class="area-label" x="220" y="260">SAFE ZONE · texto crítico só aqui</text>

  <!-- Círculo orgânico expandido -->
  <circle class="circle-pos" cx="4800" cy="0" r="2000"/>
  <text class="label-mini" x="3600" y="280">círculo orgânico · raio 2000px · top-right</text>

  <!-- Área de keyword/headline -->
  <rect x="220" y="700" width="3200" height="600" fill="#005A45" opacity="0.08"/>
  <text class="area-label" x="260" y="780">HEADLINE · Work Sans 900 italic · 280-400px</text>
  <text class="label-mini" x="260" y="840">Legível a 100m: minimum stroke ~28cm equiv</text>
  <text class="label-mini" x="260" y="890">Exemplo: "diferença" em 350px</text>
  <text class="label-mini" x="260" y="940">Suporte acima: 60-80px</text>

  <!-- Logo (dentro do círculo) -->
  <rect x="3700" y="220" width="900" height="280" fill="#005A45" opacity="0.1"/>
  <text class="area-label" x="3740" y="320">LOGO 35 ANOS</text>
  <text class="label-mini" x="3740" y="380">cipasa-completo-35anos.svg · h≈220px</text>

  <!-- Considerações técnicas -->
  <rect x="220" y="1400" width="2800" height="180" fill="#FF6B6B" opacity="0.1"/>
  <text class="area-label" x="260" y="1450">CONSIDERAÇÕES TÉCNICAS</text>
  <text class="label-mini" x="260" y="1495">• 1 só ideia por outdoor</text>
  <text class="label-mini" x="260" y="1535">• Máximo 7 palavras</text>
  <text class="label-mini" x="260" y="1575">• Foto + 1 keyword + logo · nada mais</text>
</svg>
